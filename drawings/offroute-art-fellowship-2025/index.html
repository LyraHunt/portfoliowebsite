<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lyra Hunt - Art Fellowship 2025</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    
    <link rel="stylesheet" href="/styles/reset.css">
    <link rel="stylesheet" href="/styles/style.css">
    <link rel="stylesheet" href="/styles/lightbox.css">
</head>
<body>
    <div class="flex-column  main-column">
        <div id="headerContainer"></div>

        <div class="main-content">
            <div class="flex-column">
                 <div style="min-width: 275px; max-width: min(50vw, 600px);">
                    <div class="ink-border-image-thin" style="position: relative;">
                        <img src="/drawings/offroute-art-fellowship-2025/images/newgrowth.png" class="lightbox-image-0-0" style="max-width: 100%;">
                    </div>
                    <div class="ink-border-image-thin" style="position: relative; margin-top: 20px;">
                        <img src="/drawings/offroute-art-fellowship-2025/images/im-not-my-season.png" class="lightbox-image-0-1" style="max-width: 100%;">
                    </div>
                    <div class="ink-border-image-thin" style="position: relative; margin-top: 20px;">
                        <img src="/drawings/offroute-art-fellowship-2025/images/eyes-on-the-capital.png" class="lightbox-image-0-2" style="max-width: 100%;">
                    </div>
                </div>
            </div>
        </div>

        <div id="footerContainer"></div>
    </div>

    <div id="lightbox" onclick="closeLightbox()">
        <div id="lightboxImgContainer">
            <span class="lightboxNav" onclick="changeLightboxImg(-1); event.stopPropagation()">&lt;</span>
            <div id="lightboxImgContainerOuter">
                <div id="lightboxImgContainerInner" style="max-height: 100%; aspect-ratio: 0.7; align-items: center; justify-content: center; display: flex;">
                    <img id="lightboxImg" onclick="event.stopPropagation()">
                </div>
            </div>
            <span class="lightboxNav" onclick="changeLightboxImg(1); event.stopPropagation()">&gt;</span>
        </div>
        <span id="lightboxClose" onclick="closeLightbox(); event.stopPropagation()">&times;</span>
        <div id="lightboxMobileNavBar">
            <span id="lightboxMobileNavLeft" class="lightboxMobileNav" onclick="changeLightboxImg(-1); event.stopPropagation()">&lt;</span>
            <span id="lightboxMobileNavRight" class="lightboxMobileNav" onclick="changeLightboxImg(1); event.stopPropagation()">&gt;</span>
        </div>
    </div>

    <span id="additionalScripts" data-script-list="lightbox"></span>
    <script src="/general_javascripts/load_globals.js"></script>
</body>
</html>
