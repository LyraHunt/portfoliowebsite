<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lyra Hunt - Twig</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon">

    <link rel="stylesheet" href="/styles/reset.css">
    <link rel="stylesheet" href="/styles/style.css">
    <link rel="stylesheet" href="/styles/projectdescription.css">
</head>
<body>
    <div class="flex-column main-column">
        <div class="background-image-grapevine"></div>
        <div id="headerContainer"></div>

        <div class="main-content">
            <div class="flex-column">

                <div class="project-title-container ink-border-project-title">
                    <h1 class="project-title">Twig</h1>
                    <h2 class="project-year">(2026)</h2>
                    <h2>A story-based game made as a five-person team for a game jam.</h2>
                    <h2 class="project-margin-20-top">Made with the Godot game engine.</h2>
                    <h2 class="project-margin-20-top"><a class="external-link-itch-twig" href="/" target="_blank">Play on Itch.io</a></h2>
                </div>

                <div class="project-margin-20-top text-box-shadow only-display-on-mobile warning-message">
                    <p>
                        * Not playable on mobile *
                    </p>
                </div>

                <div class="project-column-60 project-margin-50-top text-box-shadow">
                    <h2>
                        *A.K.A. I somehow convinced four of my friends to create a video game in nine days.
                    </h2>
                </div>

                <div class="project-column-80 project-margin-50-top">
                    <div class="project-gallery-wrap">
                        <img src="/projects/twig/images/twigscreenshot-intro.png" class="project-image-large project-border-thin">
                        <img src="/projects/twig/images/twigscreenshot-window.png" class="project-image-large project-border-thin">
                        <img src="/projects/twig/images/twigscreenshot-crate.png" class="project-image-large project-border-thin">
                        <img src="/projects/twig/images/twigscreenshot-charge.png" class="project-image-large project-border-thin">
                    </div>
                </div>

                <div class="project-margin-50-top text-box-shadow">
                    <h2><a class="page-link-workshop" href="/">Back to Workshop</a></h2>
                </div>

            </div>
        </div>

        <div id="footerContainer"></div>
    </div>

    <script src="/general_javascripts/load_globals.js"></script>
</body>
</html>
